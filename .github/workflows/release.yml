name: release

# A `v*` tag push builds every platform Tauri can bundle for and drafts a GitHub release
# with all the installers attached. A manual run builds them too, but only uploads them as
# workflow artifacts. Steps and caveats: docs/packaging.md.
#
#   Windows  x64, x86, arm64   NSIS installer (.exe)
#   macOS    Apple silicon, Intel   disk image (.dmg)
#   Linux    x64, arm64        .deb, .rpm, .AppImage
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Version, type and test checks run once, on Windows (the primary platform), so the
  # platform builds below only have to build.
  checks:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # package.json has no "packageManager" field, so the pnpm major is given here
      # (lockfileVersion 9.0 is read by pnpm 9 and 10). With a "packageManager" field,
      # drop `version` and the action reads the field.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Tag runs can only read caches saved from the default branch, so they never save
      # one (`save-if`); .github/workflows/cache-warm.yml fills them from main.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: checks
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check that the versions and the changelog agree
        run: pnpm check:version

      - name: Check that the tag is the version
        if: github.ref_type == 'tag'
        shell: bash
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Frontend tests
        run: pnpm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  build:
    needs: checks
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: windows-x86
            os: windows-latest
            target: i686-pc-windows-msvc
            bundles: nsis
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: macos-apple-silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          # Cross compiled from the Apple silicon runner (Intel runners are being retired).
          - name: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: build-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libgtk-3-dev patchelf rpm file

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the installers
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Installer sizes
        shell: bash
        run: |
          dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          files=$(find "$dir" -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \))
          if [ -z "$files" ]; then echo "no installer was produced"; exit 1; fi
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          for f in $files; do
            echo "- $(basename "$f"): $(wc -c < "$f") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: clipdump-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: clipdump-*
          path: installers

      # Flatten the per-platform artifact folders. `cp -n` never overwrites, so a name
      # clash between two platforms would silently drop a file; Tauri's file names carry
      # the architecture, so none is expected.
      - name: Collect installers
        run: |
          mkdir release-files
          find installers -type f -exec cp -n {} release-files/ \;
          ls -l release-files

      # A draft, so the notes and the unsigned installers can be looked at before it is
      # published. Copy the matching section of CHANGELOG.md into the notes.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-files/*
