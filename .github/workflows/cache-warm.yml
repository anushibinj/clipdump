name: cache-warm

# Tag builds (release.yml) can only restore caches saved from the default branch. This
# workflow compiles the same dependencies on master, under the same cache keys, so a
# release starts warm. GitHub evicts caches unused for 7 days; after that the next
# release builds cold, or run this workflow by hand first.
on:
  push:
    branches: [master]
    paths:
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
      - ".github/workflows/cache-warm.yml"
  workflow_dispatch:

concurrency:
  group: cache-warm
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: checks
      # Builds the test binaries (dev profile) without running them.
      - run: cargo test --no-run
        working-directory: src-tauri

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: i686-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: build-${{ matrix.target }}
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libgtk-3-dev patchelf rpm file
      - run: pnpm install --frozen-lockfile
      # Compiles the release profile like `tauri build`, but skips bundling.
      - run: pnpm tauri build --no-bundle --target ${{ matrix.target }}
