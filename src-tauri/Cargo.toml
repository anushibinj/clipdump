[package]
name = "clipdump"
version = "0.11.1"
description = "Ultra-fast clipboard dumpyard"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipdump_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# XChaCha20-Poly1305 for data at rest. `zeroize` wipes the cipher key schedule on drop.
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
zeroize = "1"
crossbeam-channel = "0.5"
anyhow = "1"
# `bundled` compiles SQLite in, so there is no system dependency on Windows.
rusqlite = { version = "0.43", features = ["bundled"] }
# xxh3-128 is the content hash for dedup and the self-write guard.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "webp"] }
# Store: read mostly RwLock (search takes only a read lock), byte budgeted blob
# cache, and parallel decrypt of the history at startup.
parking_lot = "0.13"
lru = "0.19"
rayon = "1.12"
# Fuzzy matcher (Phase 8). The default `unicode-segmentation` feature is off on
# purpose: with it nucleo collapses every grapheme cluster to its first code point,
# so match indices would count grapheme clusters, but the frontend highlights by
# character (code point) position. Without it each `char` is one position, which is
# also a little faster. Case folding and Latin normalization stay on.
nucleo-matcher = { version = "0.3.1", default-features = false, features = ["unicode-casefold", "unicode-normalization"] }
# Substring search over the history: the fast path that decides most items before
# nucleo is asked (see `search.rs`). Already in the tree through nucleo.
memchr = "2"

# "Split" (llm.rs): one blocking JSON POST to the user's OpenAI compatible server.
# No async runtime needed (commands run on Tauri's thread pool); rustls with bundled
# roots, so it also works where the OS has no TLS stack set up.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

# Speed and size over build time. See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# `cargo bench` (the Phase 8 search benchmark). The inherited release profile has
# fat LTO and one codegen unit, which would spend minutes and gigabytes
# re-optimizing all of Tauri for a benchmark of one module. So LTO is off and the
# dependencies are built unoptimized, except the ones on the search path (the
# matcher, memchr which it calls, and the benchmark harness). The code under test
# (`search.rs`, `model.rs`) is the package itself and stays at opt-level 3.
# Numbers are therefore close to, but not identical with, the shipped release
# build: LTO can only make the Windows release a little faster.
[profile.bench]
inherits = "release"
opt-level = 3
lto = "off"
codegen-units = 16
strip = "none"

[profile.bench.package."*"]
opt-level = 0

[profile.bench.package.nucleo-matcher]
opt-level = 3

[profile.bench.package.memchr]
opt-level = 3

[profile.bench.package.criterion]
opt-level = 3

# Phase 14 measurements (docs/perf.md): `cargo build --profile perf` and
# `cargo test --profile perf ... -- --ignored` (the stress run). The shipping
# profile above is fat LTO with one codegen unit, which costs minutes and many
# gigabytes for all of Tauri, so this one is the release profile without LTO, with
# 16 codegen units and no debug info. The code under test (this package) and the
# crates on the measured paths (image and PNG, SQLite, the cipher, the matcher,
# hashing, rayon, channels) are optimized like release; the windowing stack
# (Tauri, GTK, webkit bindings) is not, because no measurement runs inside it.
# Shipping numbers are therefore equal or better (LTO only helps), except the
# window figures, which are about the platform anyway. Never used for a release.
[profile.perf]
inherits = "release"
opt-level = 3
lto = "off"
codegen-units = 16
debug = false
strip = true

[profile.perf.package."*"]
opt-level = 0

[profile.perf.package.image]
opt-level = 3

[profile.perf.package.png]
opt-level = 3

[profile.perf.package.flate2]
opt-level = 3

[profile.perf.package."miniz_oxide@0.8.9"]
opt-level = 3

[profile.perf.package."miniz_oxide@0.9.1"]
opt-level = 3

[profile.perf.package.fdeflate]
opt-level = 3

[profile.perf.package.crc32fast]
opt-level = 3

[profile.perf.package.adler2]
opt-level = 3

[profile.perf.package.image-webp]
opt-level = 3

[profile.perf.package.byteorder-lite]
opt-level = 3

[profile.perf.package.bytemuck]
opt-level = 3

[profile.perf.package.zune-core]
opt-level = 3

[profile.perf.package.zune-jpeg]
opt-level = 3

[profile.perf.package.chacha20]
opt-level = 3

[profile.perf.package.poly1305]
opt-level = 3

[profile.perf.package.cipher]
opt-level = 3

[profile.perf.package.chacha20poly1305]
opt-level = 3

[profile.perf.package.aead]
opt-level = 3

[profile.perf.package.universal-hash]
opt-level = 3

[profile.perf.package.rusqlite]
opt-level = 3

[profile.perf.package.libsqlite3-sys]
opt-level = 3

[profile.perf.package.xxhash-rust]
opt-level = 3

[profile.perf.package.nucleo-matcher]
opt-level = 3

[profile.perf.package.memchr]
opt-level = 3

[profile.perf.package.rayon]
opt-level = 3

[profile.perf.package.rayon-core]
opt-level = 3

[profile.perf.package.crossbeam-channel]
opt-level = 3

[profile.perf.package.crossbeam-deque]
opt-level = 3

[profile.perf.package.crossbeam-epoch]
opt-level = 3

[profile.perf.package.crossbeam-utils]
opt-level = 3

[profile.perf.package."parking_lot@0.12.5"]
opt-level = 3

[profile.perf.package."parking_lot@0.13.0"]
opt-level = 3

[profile.perf.package."parking_lot_core@0.9.12"]
opt-level = 3

[profile.perf.package."parking_lot_core@0.10.0"]
opt-level = 3

[profile.perf.package.lru]
opt-level = 3

[profile.perf.package."hashbrown@0.12.3"]
opt-level = 3

[profile.perf.package."hashbrown@0.17.1"]
opt-level = 3

[profile.perf.package.serde_json]
opt-level = 3

[profile.perf.package.serde]
opt-level = 3

[profile.perf.package.itoa]
opt-level = 3

[profile.perf.package.zerocopy]
opt-level = 3

[profile.perf.package.zeroize]
opt-level = 3

[profile.perf.package.tempfile]
opt-level = 3

[[bench]]
name = "search_bench"
harness = false

# Desktop-only plugins (the product is a desktop tray app).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
# Windows only: foreground tracking (Phase 2), DPAPI key protection (Phase 3),
# clipboard listener and reader (Phase 4), OCR (Phase 7: Media_Ocr, a
# SoftwareBitmap from Graphics_Imaging filled through a DataWriter from
# Storage_Streams, and the WinRT apartment from Win32_System_WinRT), clipboard
# writer and auto-paste (Phase 11: Win32_UI_Input_KeyboardAndMouse for SendInput
# and GetAsyncKeyState).
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dev-dependencies]
# Free disk space of the stress run (statvfs); Windows uses GetDiskFreeSpaceExW.
libc = "0.2"

[dev-dependencies]
# Search benchmark only (Phase 8). `cargo_bench_support` is just the `cargo bench`
# argument handling; the HTML reports, plotters and rayon defaults are left out.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"
